name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: python3 scripts/build.py --version "$GITHUB_REF_NAME" --no-image

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "TAGS=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_ENV"

      # arm64 covers 64-bit Raspberry Pi OS (Pi 3, 4, 5); amd64 is for testing on a PC.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Headless Music Player $GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease
